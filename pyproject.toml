[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triton-weft-bench"
version = "0.4.0"
description = "Triton-Weft operator and model benchmarks with explicit native references"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.urls]
Source = "https://github.com/Tianchen-ai/triton-weft-bench"
Issues = "https://github.com/Tianchen-ai/triton-weft-bench/issues"
Weft = "https://github.com/Tianchen-ai/triton-weft"

[project.scripts]
weft-bench = "weft_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
weft_bench = ["native/**/*.h", "native/**/*.cpp", "native/**/*.c", "native/**/*.patch", "operators/*.json", "kernels/**/*.json", "catalogs/**/*.json"]
