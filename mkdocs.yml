site_name: Triton–Weft Bench
site_description: CPU kernel and llama.cpp results, author controls, compiler mechanisms and reproduction
site_url: https://tianchen-ai.github.io/triton-weft-bench/
repo_url: https://github.com/Tianchen-ai/triton-weft-bench
repo_name: Tianchen-ai/triton-weft-bench
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: build/handbook
strict: true
theme:
  name: material
  language: en
  font: false
  palette:
    primary: teal
    accent: teal
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.integrate
plugins:
  - i18n:
      docs_structure: suffix
      # Every prose page has both editions; the vector figures and CSVs are shared.
      fallback_to_default: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh-CN
          name: 中文
          build: true
          site_name: Triton–Weft Bench
          site_description: CPU 算子与 llama.cpp 结果、作者控制、编译机制及复现
          theme:
            language: zh
          nav_translations:
            Home: 首页
            Paper results: 论文结果
            Complete figure gallery: 完整结果图集
            Tables and provenance: 数据表与来源
            Reproduce: 运行与复现
            Installation: 安装
            Quickstart: 快速开始
            Inputs and implementations: 输入与实现
            Targets: 目标环境
            Catalogs: 目录
            Native references: 原生参考
            Product integration: 产品集成
            Verification: 正确性验证
            Product and Bench: 产品与 Bench
            Codex plugin: Codex 插件
  - search
markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
  - toc:
      permalink: true
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
extra_css:
  - assets/stylesheets/paper.css
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
nav:
  - Home: README.md
  - Paper results:
      - Complete figure gallery: paper/gallery.md
      - Tables and provenance: paper/README.md
  - Reproduce:
      - Installation: install.md
      - Quickstart: quickstart.md
      - Inputs and implementations: extending.md
      - Targets: targets.md
      - Catalogs: catalogs.md
      - Native references: x86-references.md
      - Product integration: triton-weft-integration.md
      - Verification: verification.md
      - Product and Bench: migration.md
      - Codex plugin: codex-plugin.md
