name: Host tooling
on: [push, pull_request]
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check out the product kernel sources for catalog resolution
        uses: actions/checkout@v4
        with:
          repository: Tianchen-ai/triton-weft
          ref: main
          path: .product-source
      - name: Select the product sources without a native compiler build
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/.product-source/python" >> "$GITHUB_ENV"
      - run: python -m pip install .
      - run: weft-bench list
      - name: CLI, workflow and catalog checks (no target compiler required)
        run: |
          python -m unittest discover -s tests -p test_tool.py -v
          python -m unittest discover -s tests -p test_workflow.py -v
          python -m unittest discover -s tests -p test_release_structure.py -v
      - run: python -m pip wheel . --no-deps --wheel-dir dist
